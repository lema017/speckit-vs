<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="generator" content="speckit-progress">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Spec Kit progress</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f8;--panel:#fff;--ink:#14181d;--soft:#5b6570;--line:#dfe3e7;--done:#1a7f4b;--track:#e7eaee;--blocked:#a85f00}
@media (prefers-color-scheme:dark){:root{--bg:#101316;--panel:#191d21;--ink:#e9edf0;--soft:#a3adb6;--line:#2c3238;--done:#3fbf7f;--track:#2c3238;--blocked:#e0a040}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--soft)}
a.spec{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;color:inherit;text-decoration:none}
a.spec:hover{border-color:var(--soft)}
a.spec:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.left{min-width:0;overflow-wrap:anywhere}
.name{font-weight:600}
.id{color:var(--soft);font-size:13px}
.count{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px;white-space:nowrap}
.flag{color:var(--blocked);font-weight:600;margin-left:8px}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--done)}
.current,.state{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:8px;color:var(--soft);white-space:nowrap}
.state.delivered{color:var(--done);border-color:var(--done)}
.state.next{color:var(--ink);border-color:var(--soft)}
h2{font-size:17px;margin:28px 0 2px;overflow-wrap:anywhere}
p.sub{margin:0;font-size:13px}
p.request{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.group .bar{margin:10px 0 12px}
.slice{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.dropped .name{text-decoration:line-through;color:var(--soft)}
.empty{color:var(--soft)}
a.design{border-color:var(--soft)}
.steps{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--soft)}
.steps b{color:var(--ink);font-weight:600}
.steps .done b::before{content:"\2713\00a0";color:var(--done)}
.steps .attention b{color:var(--blocked)}
.nextstep{margin-top:8px;font-size:13px;overflow-wrap:anywhere}
.nextstep code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
</style>
</head>
<body>
<main>
<h1>Spec Kit progress</h1>
<p>Every spec in this project. Specs that build the slices of a larger request are grouped under it.</p>
<div id="design"></div>
<div id="list"></div>
</main>
<script type="application/json" id="data">/*DATA*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var list = document.getElementById("list");
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function bar(done, total) {
    var b = el("div", "bar"), fill = el("i");
    fill.style.width = (total ? Math.round(100 * done / total) : 0) + "%";
    b.appendChild(fill);
    return b;
  }
  // One spec. With a view, it is the spec of that slice of a map.
  function card(row, view) {
    var a = el("a", "spec"), T = row.totals;
    a.href = encodeURIComponent(row.file);
    var top = el("div", "top"), left = el("div", "left");
    left.appendChild(el("span", "name", row.title));
    if (row.current) left.appendChild(el("span", "current", "current"));
    if (view) left.appendChild(el("span", "state " + view.state, view.state));
    left.appendChild(el("div", "id", view ? row.id + ", slice " + view.id : row.id));
    var count = el("div", "count", T.total ? T.done + " of " + plural(T.total, "task") : "no tasks yet");
    if (row.attention) count.appendChild(el("span", "flag", row.attention + " to check"));
    top.appendChild(left); top.appendChild(count); a.appendChild(top);
    a.appendChild(bar(T.done, T.total));
    return a;
  }
  // A slice no spec builds yet, or one that was dropped.
  function waiting(view, next) {
    var dropped = view.state === "dropped";
    var box = el("div", dropped ? "slice dropped" : "slice"), top = el("div", "top"), left = el("div", "left");
    left.appendChild(el("span", "name", view.title));
    left.appendChild(el("span", next ? "state next" : "state", dropped ? "dropped" : next ? "next" : "pending"));
    left.appendChild(el("div", "id", view.id));
    var note = dropped ? "" : view.waiting_for.length ? "waits for " + view.waiting_for.join(", ") : "no spec yet";
    top.appendChild(left); top.appendChild(el("div", "count", note)); box.appendChild(top);
    return box;
  }
  // The design of the product, when the project has one: how far it is and what comes next.
  function design(d) {
    var a = el("a", "spec design"), top = el("div", "top"), left = el("div", "left");
    a.href = encodeURIComponent(d.file);
    left.appendChild(el("span", "name", d.product || "Product"));
    left.appendChild(el("div", "id", "Product design"));
    top.appendChild(left);
    if (d.problem) {
      var broken = el("div", "count"); broken.appendChild(el("span", "flag", "cannot be read")); top.appendChild(broken);
      a.appendChild(top);
      a.appendChild(el("div", "nextstep", d.problem));
      return a;
    }
    var count = el("div", "count", d.totals.drawn + " of " + plural(d.totals.areas, "area") + " drawn");
    if (d.attention) count.appendChild(el("span", "flag", d.attention + " to check"));
    top.appendChild(count); a.appendChild(top);
    var steps = el("div", "steps");
    d.steps.forEach(function (s) {
      var one = el("span", s.state); one.appendChild(el("b", "", s.label)); one.appendChild(document.createTextNode(" " + s.fact));
      steps.appendChild(one);
    });
    a.appendChild(steps);
    var next = el("div", "nextstep"); next.appendChild(document.createTextNode("Next: ")); next.appendChild(el("code", "", d.next.command));
    a.appendChild(next);
    return a;
  }
  if (D.design) document.getElementById("design").appendChild(design(D.design));
  var maps = D.maps || [], byId = Object.create(null), shown = Object.create(null);
  D.specs.forEach(function (row) { byId[row.id] = row; });
  maps.forEach(function (map) {
    var head = el("div", "group");
    head.appendChild(el("h2", "", map.name));
    head.appendChild(el("p", "sub", map.total ? map.delivered + " of " + plural(map.total, "slice") + " delivered" : "every slice was dropped"));
    if (map.request) head.appendChild(el("p", "request", map.request));
    head.appendChild(bar(map.delivered, map.total));
    list.appendChild(head);
    map.slices.forEach(function (view) {
      var row = view.spec !== null && !shown[view.spec] ? byId[view.spec] : null;
      if (row) { shown[row.id] = true; list.appendChild(card(row, view)); }
      else list.appendChild(waiting(view, map.next === view.id));
    });
  });
  var rest = D.specs.filter(function (row) { return !shown[row.id]; });
  if (maps.length && rest.length) list.appendChild(el("h2", "", "Other specs"));
  rest.forEach(function (row) { list.appendChild(card(row, null)); });
  if (!D.specs.length && !maps.length) list.appendChild(el("div", "empty", D.design ? "No specs yet. They come after the design." : "No specs yet."));
  setInterval(function () { if (document.visibilityState === "visible") location.reload(); }, 15000);
})();
</script>
</body>
</html>
