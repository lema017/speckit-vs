<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <title>Crear una cuenta en Oficio</title>
  <link rel="stylesheet" href="_studio/theme.css">
  <link rel="stylesheet" href="_studio/kit.css">
  <script src="_studio/product.js"></script>
  <script src="_studio/screens.js"></script>
  <script src="_studio/runtime.js"></script>
</head>
<body data-screen="SCR-signup" data-area="acceso" data-layout="auth">
  <div class="app">
    <div class="auth">
      <main class="card">
        <div class="brand"><span class="brand-mark" aria-hidden="true">O</span><span translate="no">Oficio</span></div>
        <h1>Crea tu cuenta</h1>
        <p class="lead">Para apuntarte a talleres de tu barrio o dar uno.</p>

        <div class="stack" data-ref="ST-2 R-login-oauth">
          <a class="btn" href="inicio.html?sesion=1&amp;estado=vacio"><span class="provider-icon google" aria-hidden="true">G</span>Continuar con Google</a>
          <a class="btn" href="inicio.html?sesion=1&amp;estado=vacio"><span class="provider-icon facebook" aria-hidden="true">f</span>Continuar con Facebook</a>
          <a class="btn" href="inicio.html?sesion=1&amp;estado=vacio"><span class="provider-icon github" aria-hidden="true">G</span>Continuar con GitHub</a>
        </div>

        <p class="divider">o con tu correo</p>

        <div class="alert alert-danger" role="alert" id="registro-error" data-state="error" data-ref="R-signup-unique-email" hidden>
          <p><strong>Ya hay una cuenta con ese correo.</strong></p>
          <p><a href="entrar.html">Entra con ella</a> o <a href="recuperar.html">cambia la contraseña</a>.</p>
        </div>

        <form data-ref="ST-3" data-goto="inicio.html?sesion=1&amp;estado=vacio" novalidate>
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="given-name" required data-msg-required="Escribe tu nombre.">
          </div>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" autocapitalize="none" required data-msg-required="Escribe tu correo." data-invalid-in="error" data-error-ref="registro-error">
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="password">
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" data-msg-required="Elige una contraseña." aria-describedby="password-pista">
              <button class="toggle" type="button" aria-controls="password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <p class="hint" id="password-pista" data-ref="R-password-length">Al menos 8 caracteres.</p>
          </div>
          <button class="btn btn-primary" type="submit" data-loading-label="Creando tu cuenta…">Crear cuenta</button>
        </form>

        <p class="foot">¿Ya tienes cuenta? <a href="entrar.html">Entra</a></p>
      </main>
    </div>
  </div>
</body>
</html>
