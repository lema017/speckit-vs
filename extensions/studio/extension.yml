schema_version: "1.0"

extension:
  id: studio
  name: "Product Studio"
  version: "0.4.0"
  description: "Design a product before building it: a guided conversation with the product owner, a mockup to click through and comment on in the browser, the approval of its business rules, and the cut of each area into specs."
  author: lema017
  repository: https://github.com/lema017/speckit-vs
  license: MIT

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: speckit.studio.define
      file: commands/speckit.studio.define.md
      description: "Start the design of a product: turn an idea into who it is for, what it does, its areas and its look, by asking the product owner"
    - name: speckit.studio.map
      file: commands/speckit.studio.map.md
      description: "Design one area of the product with the product owner: its stories, its screens with every button, its flows and its business rules in draft"
    - name: speckit.studio.mockup
      file: commands/speckit.studio.mockup.md
      description: "Draw the screens that are described as a mockup the product owner can click through in the browser, and show a picture of each one"
    - name: speckit.studio.iterate
      file: commands/speckit.studio.iterate.md
      description: "Apply what the product owner wants to change in the mockup: the comments made on it and what they say in words, one change at a time and with their yes"
    - name: speckit.studio.approve
      file: commands/speckit.studio.approve.md
      description: "Approve the business rules of one area of the product: show the product owner the exact text of each rule and, with their yes, publish them with their name and the date"
    - name: speckit.studio.slice
      file: commands/speckit.studio.slice.md
      description: "Cut one approved area of the product into slices: each is one thing a person can do and check, with its screens and its rules, and one spec builds it"

tags:
  - "design"
  - "mockup"
  - "product"
