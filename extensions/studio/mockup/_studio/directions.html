  .frame { margin-bottom: 16px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame .app { min-height: 0; }
  .frame .auth { padding: 0; }
  .frame .page { padding-bottom: 28px; }
  .phone .look { max-width: 390px; }
</style>

<div class="top">

<script type="application/json" id="data">/*DATA*/null</script>
<script>

    var section = el('section', 'look', null, { 'aria-label': look.id + ' ' + look.nombre },
      el('div', 'look-head', null, null, el('span', 'look-letter', look.id), el('div', '', null, null, title, el('p', '', look.porque))),
      el('div', 'frame', null, null, signIn()), el('div', 'frame', null, null, screen()));
    looks.appendChild(section);

  });

  var system = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : { matches: false };
  var asked = new URLSearchParams(location.search).get('modo');
  var mode = asked === 'claro' || asked === 'oscuro' ? asked : 'sistema';
  function paint() {
    var dark = mode === 'oscuro' || (mode === 'sistema' && system.matches);
    root.dataset.page = dark ? 'dark' : 'light';
    sections.forEach(function (entry) {
      var colors = dark ? entry.look.oscuro : entry.look.claro;
      Object.keys(colors).forEach(function (token) { entry.node.style.setProperty('--' + token, colors[token]); });
      entry.node.style.setProperty('--radius', entry.look.radio);

      entry.node.style.setProperty('--font', entry.look.fuente);
      entry.node.style.setProperty('color-scheme', dark ? 'dark' : 'light');

  }

  document.title = T.title.replace('{0}', name);
  document.getElementById('title').textContent = T.title.replace('{0}', name);
  document.getElementById('how').textContent = T.how;
  document.getElementById('mode-label').textContent = T.mode;
  var select = document.getElementById('mode');
  [['sistema', T.system], ['claro', T.light], ['oscuro', T.dark]].forEach(function (option) {
    select.appendChild(el('option', '', option[1], { value: option[0] }));
  });
  select.value = mode;
  select.addEventListener('change', function () { mode = select.value; paint(); });
  if (system.addEventListener) { system.addEventListener('change', paint); }
  document.addEventListener('click', function (event) { if (event.target.closest('a[href="#"]')) { event.preventDefault(); } });
  paint();
