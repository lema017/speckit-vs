schema_version: "1.0"

extension:
  id: capabilities
  name: "Capability Catalog"
  version: "0.7.2"
  description: "Keeps the approved behaviour of each capability, its origin, its code and its tests discoverable across sessions."
  author: lema017
  repository: https://github.com/lema017/speckit-vs
  license: MIT

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - name: spec-template
      file: templates/spec-template.md
      description: "Core spec template for one slice, plus the mandatory Slice and Capability Delta sections"
  commands:
    - name: speckit.capabilities.slice
      file: commands/speckit.capabilities.slice.md
      description: "Cut a request, or the designed rules of a capability, into slices of one spec each, and aim this run at one slice"
    - name: speckit.capabilities.size
      file: commands/speckit.capabilities.size.md
      description: "Measure the spec against the slice budget, and propose a split when it is over"
    - name: speckit.capabilities.context
      file: commands/speckit.capabilities.context.md
      description: "Load the approved rules a request touches. Read-only; creates no branch."
    - name: speckit.capabilities.review
      file: commands/speckit.capabilities.review.md
      description: "Validate the capability delta and surface spec changes made after review"
    - name: speckit.capabilities.fold
      file: commands/speckit.capabilities.fold.md
      description: "Publish an approved delta to the catalog and record what the code does"
    - name: speckit.capabilities.check
      file: commands/speckit.capabilities.check.md
      description: "Report the state of the changes on this branch and the integrity of the catalog"
    - name: speckit.capabilities.bootstrap
      file: commands/speckit.capabilities.bootstrap.md
      description: "Propose a capability map for an existing project and consolidate the chosen capabilities as inferred rules"
    - name: speckit.capabilities.locate
      file: commands/speckit.capabilities.locate.md
      description: "Find where a behaviour lives, which change set it and which tests cover it. Read-only."
    - name: speckit.capabilities.clarify-context
      file: commands/speckit.capabilities.clarify-context.md
      description: "Give clarify the settled rules, the conflicts and the reach of a spec before its first question. Read-only."
  config:
    - name: "capabilities-config.yml"
      template: "config-template.yml"
      description: "Feature roots, evidence options and the slice budget"
      required: false

hooks:
  before_specify:
    - command: speckit.capabilities.slice
      optional: false
      description: "Aim the spec at one slice, and propose the cut when the request holds several"
    - command: speckit.capabilities.context
      optional: false
      description: "Load approved rules before writing the spec"
  after_specify:
    - command: speckit.capabilities.size
      optional: false
      description: "Measure the spec against the slice budget"
    - command: speckit.capabilities.review
      optional: false
      description: "Validate and seal the capability delta"
  before_clarify:
    command: speckit.capabilities.clarify-context
    optional: false
    description: "Give clarify what the catalog and the graph already know"
  before_plan:
    - command: speckit.capabilities.size
      optional: false
      description: "Measure the spec again: clarifying it can make it grow"
    - command: speckit.capabilities.review
      optional: false
      description: "Surface spec changes made after the delta was sealed"
  after_tasks:
    command: speckit.capabilities.size
    optional: false
    description: "Measure the tasks against the slice budget"
  after_implement:
    command: speckit.capabilities.fold
    optional: false
    description: "Publish the delta and record what the code does"
  after_converge:
    command: speckit.capabilities.fold
    optional: false
    description: "Refresh the catalog after convergence"

tags:
  - "catalog"
  - "requirements"
  - "traceability"
