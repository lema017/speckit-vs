# Capability Catalog configuration. Flat keys only: capabilities.py reads this
# with the standard library so that any python3 can run it, in CI too.
# Version this file: CI reads it to find your feature specs.

# Comma-separated directories (globs allowed per path segment) that hold feature
# specs. A new spec.md at any depth under one of them must carry a capability delta.
# Example: specs, features, modules/*/specs
feature_roots: specs

# Accept "Tests: manual: <reason>" as evidence. When false, a rule without an
# automated test blocks `ready`.
allow_manual_evidence: false

# Allow a feature with open tasks to be integrated while the catalog has not
# folded its delta yet. When false, a feature is integrated complete.
allow_partial_features: false
# The branch that `rebase` and `defer` rebuild the catalog from when you do not
# pass --onto. Empty means main. Example: origin/develop
base_branch:

# Comma-separated globs of changed files that `coverage` does not count as a
# change of the product, beside specs/, .specify/, .claude/, .github/, the graph
# and Markdown. Example: infra/*, scripts/dev-*
coverage_ignore:

# What happens when the agent is about to end a session while work is outside
# the catalog: a spec done and not folded, or product code that no change
# records. Claude Code and Codex only.
#   warn   the agent is sent back once to finish it or say it is not done yet,
#          and not again while nothing changes (default)
#   block  the agent is sent back at every stop until the change is recorded
#   off    nothing
stop_check: warn

# The slice budget: the most one spec holds. A spec over it gets a proposal to
# split it, and you decide. Whole numbers above 0.
slice_max_stories: 1
slice_max_requirements: 15
slice_max_rules: 4
slice_max_tasks: 25
